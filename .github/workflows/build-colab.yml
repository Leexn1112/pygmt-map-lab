name: Build Colab environment
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: builder
          python-version: '3.13'
          channels: conda-forge
          conda-remove-defaults: true
      - name: Install constructor
        run: conda install -y constructor
      - name: Build Linux installer
        run: |
          mkdir -p dist
          constructor packaging/colab --output-dir dist
      - name: Install and verify in isolated prefix
        run: |
          installer=$(find dist -maxdepth 1 -name '*.sh' -print -quit)
          test -n "$installer"
          bash "$installer" -b -p "$RUNNER_TEMP/pygmt-smoke"
          export PATH="$RUNNER_TEMP/pygmt-smoke/bin:$PATH"
          export GMT_LIBRARY_PATH="$RUNNER_TEMP/pygmt-smoke/lib"
          python packaging/colab/smoke_test.py
          conda list -p "$RUNNER_TEMP/pygmt-smoke" --explicit > dist/environment-linux-64.lock.txt
          sha256sum "$installer" > dist/SHA256SUMS
          cp packaging/colab/install_colab.py dist/
      - uses: actions/upload-artifact@v4
        with:
          name: pygmt-colab-linux-64-py313
          path: dist/
          retention-days: 14
          compression-level: 0
